name: KMP toolchain proof

on:
  pull_request:
    paths:
      - 'migration-spike/kmp-toolchain/**'
      - 'shared/**'
      - 'iosApp/**'
      - 'desktopApp/**'
      - 'androidHost/**'
      - 'lyrics/src/main/kotlin/com/convx/music/lyrics/LyricsSyncLevel.kt'
      - 'lyrics/src/main/kotlin/com/convx/music/lyrics/LyricsEntry.kt'
      - 'lyrics/src/main/kotlin/com/convx/music/lyrics/LyricTimeline.kt'
      - 'lyrics/src/main/kotlin/com/convx/music/lyrics/TimedLyricsParser.kt'
      - 'lyrics/src/main/kotlin/com/convx/music/lyrics/bitchord/LrcParser.kt'
      - 'lyrics/src/main/kotlin/com/convx/music/lyrics/bitchord/LyricLine.kt'
      - 'lyrics/src/main/kotlin/com/convx/music/lyrics/bitchord/LyricGaps.kt'
      - 'lyrics/src/main/kotlin/com/convx/music/lyrics/bitchord/SyllableRuns.kt'
      - 'lyrics/src/test/**'
      - 'app/src/main/kotlin/com/convx/music/playback/ShuffleOrderPolicy.kt'
      - 'app/src/main/kotlin/com/convx/music/playback/PlaybackSnapshot.kt'
      - 'app/src/main/kotlin/com/convx/music/playback/PlaybackController.kt'
      - 'app/src/test/kotlin/com/convx/music/playback/ShuffleOrderPolicyTest.kt'
      - 'canvas/src/main/kotlin/com/convx/music/canvas/ApplePlaylistLink.kt'
      - 'canvas/src/main/kotlin/com/convx/music/canvas/AppleMusicPlaylistMapper.kt'
      - 'canvas/src/main/kotlin/com/convx/music/canvas/CanvasArtwork.kt'
      - 'canvas/src/main/kotlin/com/convx/music/canvas/AppleArtwork.kt'
      - 'canvas/src/main/kotlin/com/convx/music/canvas/AppleArtist.kt'
      - 'canvas/src/main/kotlin/com/convx/music/canvas/AppleMusicDataMapper.kt'
      - 'gradle/libs.versions.toml'
      - 'gradle/wrapper/**'
      - 'settings.gradle.kts'
      - 'build.gradle.kts'
      - '.github/workflows/kmp-toolchain-proof.yml'
  push:
    branches: ['**']
    paths:
      - 'migration-spike/kmp-toolchain/**'
      - 'shared/**'
      - 'iosApp/**'
      - 'desktopApp/**'
      - 'androidHost/**'
      - 'lyrics/src/main/kotlin/com/convx/music/lyrics/LyricsSyncLevel.kt'
      - 'lyrics/src/main/kotlin/com/convx/music/lyrics/LyricsEntry.kt'
      - 'lyrics/src/main/kotlin/com/convx/music/lyrics/LyricTimeline.kt'
      - 'lyrics/src/main/kotlin/com/convx/music/lyrics/TimedLyricsParser.kt'
      - 'lyrics/src/main/kotlin/com/convx/music/lyrics/bitchord/LrcParser.kt'
      - 'lyrics/src/main/kotlin/com/convx/music/lyrics/bitchord/LyricLine.kt'
      - 'lyrics/src/main/kotlin/com/convx/music/lyrics/bitchord/LyricGaps.kt'
      - 'lyrics/src/main/kotlin/com/convx/music/lyrics/bitchord/SyllableRuns.kt'
      - 'lyrics/src/test/**'
      - 'app/src/main/kotlin/com/convx/music/playback/ShuffleOrderPolicy.kt'
      - 'app/src/main/kotlin/com/convx/music/playback/PlaybackSnapshot.kt'
      - 'app/src/main/kotlin/com/convx/music/playback/PlaybackController.kt'
      - 'app/src/test/kotlin/com/convx/music/playback/ShuffleOrderPolicyTest.kt'
      - 'canvas/src/main/kotlin/com/convx/music/canvas/ApplePlaylistLink.kt'
      - 'canvas/src/main/kotlin/com/convx/music/canvas/AppleMusicPlaylistMapper.kt'
      - 'canvas/src/main/kotlin/com/convx/music/canvas/CanvasArtwork.kt'
      - 'canvas/src/main/kotlin/com/convx/music/canvas/AppleArtwork.kt'
      - 'canvas/src/main/kotlin/com/convx/music/canvas/AppleArtist.kt'
      - 'canvas/src/main/kotlin/com/convx/music/canvas/AppleMusicDataMapper.kt'
      - 'gradle/libs.versions.toml'
      - 'gradle/wrapper/**'
      - 'settings.gradle.kts'
      - 'build.gradle.kts'
      - '.github/workflows/kmp-toolchain-proof.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kmp-toolchain-${{ github.ref }}
  cancel-in-progress: true

jobs:
  common-tests:
    name: Common tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v4
      - name: Make Gradle wrapper executable
        run: chmod +x gradlew
      - run: ./gradlew -p migration-spike/kmp-toolchain :shared:desktopTest --no-configuration-cache --console=plain

  android-linkage:
    name: Android shared screen linkage
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v4
      - name: Make Gradle wrapper executable
        run: chmod +x gradlew
      - run: ./gradlew -p migration-spike/kmp-toolchain :androidHost:assembleDebug --no-configuration-cache --console=plain

  ios-simulator:
    name: iOS simulator host
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v4
      - name: Make Gradle wrapper executable
        run: chmod +x gradlew
      - name: Report runner Xcode
        run: xcodebuild -version
      - name: Build shared framework for simulator
        run: ./gradlew -p migration-spike/kmp-toolchain :shared:linkDebugFrameworkIosSimulatorArm64 --no-configuration-cache --console=plain
      - name: Build SwiftUI simulator host
        run: xcodebuild -project migration-spike/kmp-toolchain/iosApp/ConvxKmpHost.xcodeproj -scheme ConvxKmpHost -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build

  desktop-packaging:
    name: Desktop packaging (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022, macos-15]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v4
      - name: Make Gradle wrapper executable on Unix
        if: runner.os != 'Windows'
        run: chmod +x gradlew
      - name: Package desktop app on Unix
        if: runner.os != 'Windows'
        run: ./gradlew -p migration-spike/kmp-toolchain :desktopApp:createDistributable --no-configuration-cache --console=plain
      - name: Package desktop app on Windows
        if: runner.os == 'Windows'
        run: .\gradlew.bat -p migration-spike/kmp-toolchain :desktopApp:createDistributable --no-configuration-cache --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: convx-desktop-${{ matrix.os }}
          path: migration-spike/kmp-toolchain/desktopApp/build/compose/binaries/main/app/**
          if-no-files-found: error
