name: KMP Room persistence proof

on:
  pull_request:
    paths:
      - 'migration-spike/room-kmp-proof/**'
      - '.github/workflows/kmp-room-persistence-proof.yml'
      - 'gradle/wrapper/**'
  push:
    branches: ['**']
    paths:
      - 'migration-spike/room-kmp-proof/**'
      - '.github/workflows/kmp-room-persistence-proof.yml'
      - 'gradle/wrapper/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: room-kmp-proof-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop-and-android:
    name: Room KMP desktop and Android compilation
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v4
      - name: Make Gradle wrapper executable
        run: chmod +x gradlew
      - name: Compile Room KMP on Android
        run: ./gradlew -p migration-spike/room-kmp-proof :shared:compileAndroidMain --no-configuration-cache --console=plain
      - name: Compile and test Room KMP on desktop JVM
        run: ./gradlew -p migration-spike/room-kmp-proof :shared:desktopTest --no-configuration-cache --console=plain

  ios-simulator:
    name: Room KMP iOS simulator compilation
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v4
      - name: Select and verify Xcode 16.4
        run: |
          sudo xcode-select --switch /Applications/Xcode_16.4.app/Contents/Developer
          xcodebuild -version
      - name: Make Gradle wrapper executable
        run: chmod +x gradlew
      - name: Compile Room KMP iOS simulator target
        run: ./gradlew -p migration-spike/room-kmp-proof :shared:compileKotlinIosSimulatorArm64 --no-configuration-cache --console=plain
      - name: Run Room KMP persistence test on iOS simulator
        run: ./gradlew -p migration-spike/room-kmp-proof :shared:iosSimulatorArm64Test --no-configuration-cache --console=plain

  windows-desktop:
    name: Room KMP desktop JVM on Windows
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v4
      - name: Run Room KMP common tests on Windows
        run: .\gradlew.bat -p migration-spike/room-kmp-proof :shared:desktopTest --no-configuration-cache --console=plain
